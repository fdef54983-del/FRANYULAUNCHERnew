name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create out directory
        run: mkdir -p out

      - name: Build FranyuLauncher 1.2 APK
        run: |
          gradle :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FranyuLauncher-1.2.apk

      - name: Build FranyuLauncher 1.2 AAB
        run: |
          gradle :app_pojavlauncher:bundleFullRelease
          mv app_pojavlauncher/build/outputs/bundle/fullRelease/app_pojavlauncher-full-release.aab out/FranyuLauncher-1.2.aab

      - name: Build Debug APK (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-1.2-noruntime.apk

      - name: Verify APK and AAB archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher-1.2.apk
          test -s out/FranyuLauncher-1.2-noruntime.apk
          test -s out/FranyuLauncher-1.2.aab
          unzip -t out/FranyuLauncher-1.2.apk
          unzip -t out/FranyuLauncher-1.2-noruntime.apk
          unzip -t out/FranyuLauncher-1.2.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.2.apk

      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher-1.2.apk > out/FranyuLauncher-1.2.apk.sha256
          sha256sum out/FranyuLauncher-1.2-noruntime.apk > out/FranyuLauncher-1.2-noruntime.apk.sha256
          sha256sum out/FranyuLauncher-1.2.aab > out/FranyuLauncher-1.2.aab.sha256

      - name: Upload FranyuLauncher 1.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-1.2
          path: |
            out/FranyuLauncher-1.2.apk
            out/FranyuLauncher-1.2.apk.sha256
            out/FranyuLauncher-1.2-noruntime.apk
            out/FranyuLauncher-1.2-noruntime.apk.sha256
            out/FranyuLauncher-1.2.aab
            out/FranyuLauncher-1.2.aab.sha256
          compression-level: 0

      - name: Create GitHub Release v1.2
        uses: softprops/action-gh-release@v2
        if: github.repository_owner == 'fdef54983-del' && github.ref_name == 'feat/standard_cursors'
        with:
          tag_name: "v1.2"
          name: "FranyuLauncher v1.2"
          body: |
            ### FranyuLauncher v1.2
            - Rebrand cleanup and FranyuLauncher crash reporting.
            - Resilient downloads with concurrent workers, retries, exponential backoff and HTTP Range resume.
            - SHA-256 checksums for published artifacts.
            - Release APK and AAB builds without requiring the unavailable mojo_upload.jks signing secret.
            - Deferred non-critical runtime initialization and session version-list caching.

            **APK:** direct installation artifact.
            **AAB:** Android App Bundle for store distribution.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher-1.2.apk
            out/FranyuLauncher-1.2.apk.sha256
            out/FranyuLauncher-1.2-noruntime.apk
            out/FranyuLauncher-1.2-noruntime.apk.sha256
            out/FranyuLauncher-1.2.aab
            out/FranyuLauncher-1.2.aab.sha256
