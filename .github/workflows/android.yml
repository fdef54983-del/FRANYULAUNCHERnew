name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      FRANYU_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Executable Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create out directory
        run: mkdir -p out

      - name: Build FranyuLauncher 1.3 APK
        run: |
          ./gradlew :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FranyuLauncher-1.3.apk

      - name: Build FranyuLauncher 1.3 AAB
        run: |
          ./gradlew :app_pojavlauncher:bundleFullRelease
          mv app_pojavlauncher/build/outputs/bundle/fullRelease/app_pojavlauncher-full-release.aab out/FranyuLauncher-1.3.aab

      - name: Build Debug APK (No runtime)
        run: |
          ./gradlew :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-1.3-noruntime.apk

      - name: Verify APK and AAB archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher-1.3.apk
          test -s out/FranyuLauncher-1.3-noruntime.apk
          test -s out/FranyuLauncher-1.3.aab
          unzip -t out/FranyuLauncher-1.3.apk
          unzip -t out/FranyuLauncher-1.3-noruntime.apk
          unzip -t out/FranyuLauncher-1.3.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 out/FranyuLauncher-1.3.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.3.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.3-noruntime.apk

      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher-1.3.apk > out/FranyuLauncher-1.3.apk.sha256
          sha256sum out/FranyuLauncher-1.3-noruntime.apk > out/FranyuLauncher-1.3-noruntime.apk.sha256
          sha256sum out/FranyuLauncher-1.3.aab > out/FranyuLauncher-1.3.aab.sha256

      - name: Upload FranyuLauncher 1.3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-1.3
          path: |
            out/FranyuLauncher-1.3.apk
            out/FranyuLauncher-1.3.apk.sha256
            out/FranyuLauncher-1.3-noruntime.apk
            out/FranyuLauncher-1.3-noruntime.apk.sha256
            out/FranyuLauncher-1.3.aab
            out/FranyuLauncher-1.3.aab.sha256
          compression-level: 0

      - name: Create GitHub Release v1.3
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feat/standard_cursors' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v1.3"
          name: "FranyuLauncher v1.3"
          body: |
            ## 🚀 FranyuLauncher v1.3 Official Release

            ### ✨ Principales Novedades y Mejoras
            - **Mayor Compatibilidad Android**: Soporte optimizado desde Android 5.0 (API 21) hasta Android 15 (API 35/36).
            - **Solución al Problema de Instalación**: Ajustes en manifiesto (`requestLegacyExternalStorage`, permisos de almacenamiento y servicios en segundo plano).
            - **Alto Rendimiento en Juego**: Inyección automática de argumentos JVM de bajo consumo (`G1GC`, reducción de pausas a 20ms, paralelismo y pretouch de memoria).
            - **Rediseño Visual & Animaciones**: Nueva estética de tarjetas con degradados esmeralda, bordes redondeados y transiciones suaves de entrada.
            - **Descargas Resilientes**: Descarga de assets con reconexión automática mediante cabeceras HTTP Range y verificación SHA-256.
            - **Integración con Modloaders**: Soporte completo para Forge, Fabric, Quilt, NeoForge y Better Than Adventure (BTA).

            ### 📦 Artefactos incluidos
            - `FranyuLauncher-1.3.apk`: Versión completa con entornos Java embebidos (JRE 8, JRE 17 y JRE 21).
            - `FranyuLauncher-1.3-noruntime.apk`: Versión compacta.
            - `FranyuLauncher-1.3.aab`: Android App Bundle para tiendas de aplicaciones.
            - Archivos de comprobación criptográfica `.sha256` para cada binario.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher-1.3.apk
            out/FranyuLauncher-1.3.apk.sha256
            out/FranyuLauncher-1.3-noruntime.apk
            out/FranyuLauncher-1.3-noruntime.apk.sha256
            out/FranyuLauncher-1.3.aab
            out/FranyuLauncher-1.3.aab.sha256