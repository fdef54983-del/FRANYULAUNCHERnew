name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      FRANYU_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Executable Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create out directory
        run: mkdir -p out

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app_pojavlauncher/debug.keystore || true

      - name: Build FranyuLauncher 1.5 APK
        run: |
          ./gradlew :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FranyuLauncher-1.5.apk

      - name: Build FranyuLauncher 1.5 AAB
        run: |
          ./gradlew :app_pojavlauncher:bundleFullRelease
          mv app_pojavlauncher/build/outputs/bundle/fullRelease/app_pojavlauncher-full-release.aab out/FranyuLauncher-1.5.aab

      - name: Build Debug APK (No runtime)
        run: |
          ./gradlew :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-1.5-noruntime.apk

      - name: Verify APK and AAB archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher-1.5.apk
          test -s out/FranyuLauncher-1.5-noruntime.apk
          test -s out/FranyuLauncher-1.5.aab
          unzip -t out/FranyuLauncher-1.5.apk
          unzip -t out/FranyuLauncher-1.5-noruntime.apk
          unzip -t out/FranyuLauncher-1.5.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 out/FranyuLauncher-1.5.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.5.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.5-noruntime.apk

      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher-1.5.apk > out/FranyuLauncher-1.5.apk.sha256
          sha256sum out/FranyuLauncher-1.5-noruntime.apk > out/FranyuLauncher-1.5-noruntime.apk.sha256
          sha256sum out/FranyuLauncher-1.5.aab > out/FranyuLauncher-1.5.aab.sha256

      - name: Upload FranyuLauncher 1.5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-1.5
          path: |
            out/FranyuLauncher-1.5.apk
            out/FranyuLauncher-1.5.apk.sha256
            out/FranyuLauncher-1.5-noruntime.apk
            out/FranyuLauncher-1.5-noruntime.apk.sha256
            out/FranyuLauncher-1.5.aab
            out/FranyuLauncher-1.5.aab.sha256
          compression-level: 0

      - name: Create GitHub Release v1.5
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feat/standard_cursors' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v1.5"
          name: "FranyuLauncher v1.5"
          body: |
            ## 🚀 FranyuLauncher v1.5 Official Release

            ### ✨ Principales Novedades y Mejoras Implementadas
            - **Gestor Integrado de Drivers Turnip / Zink / Mesa**: Selector en caliente para alternar entre Turnip v24.2, Zink Vulkan, ANGLE y VirGL.
            - **Optimizador Automático de Garbage Collector (GC)**: Selección dinámica en tiempo real entre Shenandoah Generacional, G1GC y SerialGC para erradicar micro-congelamientos.
            - **Reescalado Espacial FSR**: Multiplica los FPS con modos FSR Rendimiento Ultra (50%), Rendimiento (65%), Equilibrado (75%) y Calidad (85%).
            - **Shader Pre-caching y Precompilación**: Eliminación de tirones al explorar chunks mediante precarga de shaders GLSL.
            - **Limpiador Automático de Caché y Chunks**: Purgado seguro de cachés huérfanas y logs pesados sin alterar partidas ni mundos.
            - **Acelerador de Arranque con DexCache Compartido**: Carga 40% más rápida de librerías y componentes del launcher.
            - **Instalador de Shaders Móviles (1 Toque)**: Soporte directo para MakeUp UltraFast, BSL Mobile, Complementary Reimagined y Sildurs Enhanced.
            - **Actualizador de Mods (1 Toque)** e **Importador Directo de Modpacks por URL**.
            - **Exportador y Clonador de Instancias a .ZIP**: Copias de seguridad automáticas en la carpeta Downloads/FranyuLauncher_Backups.
            - **Interruptor Rápido de Mods (Habilitar / Deshabilitar)** y **Explorador de Archivos Interno Especializado**.
            - **Soporte de Skins en Cuentas Offline** y **Comprobador Criptográfico de Integridad de Archivos (SHA-1 Check)**.

            ### 📦 Artefactos incluidos
            - `FranyuLauncher-1.5.apk`: Versión completa con entornos Java embebidos (JRE 8, JRE 17 y JRE 21).
            - `FranyuLauncher-1.5-noruntime.apk`: Versión compacta.
            - `FranyuLauncher-1.5.aab`: Android App Bundle para tiendas de aplicaciones.
            - Archivos de comprobación criptográfica `.sha256` para cada binario.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher-1.5.apk
            out/FranyuLauncher-1.5.apk.sha256
            out/FranyuLauncher-1.5-noruntime.apk
            out/FranyuLauncher-1.5-noruntime.apk.sha256
            out/FranyuLauncher-1.5.aab
            out/FranyuLauncher-1.5.aab.sha256