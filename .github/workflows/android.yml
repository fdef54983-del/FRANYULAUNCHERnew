name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/FranyuLauncher.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-noruntime.apk

      - name: Verify APK archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher.apk
          test -s out/FranyuLauncher-noruntime.apk
          unzip -t out/FranyuLauncher.apk
          unzip -t out/FranyuLauncher-noruntime.apk
          apksigner verify --verbose out/FranyuLauncher.apk
          apksigner verify --verbose out/FranyuLauncher-noruntime.apk

      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher.apk > out/FranyuLauncher.apk.sha256
          sha256sum out/FranyuLauncher-noruntime.apk > out/FranyuLauncher-noruntime.apk.sha256

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-debug
          path: |
            out/FranyuLauncher.apk
            out/FranyuLauncher.apk.sha256
          compression-level: 0

      - name: Upload Debug APK artifact (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-noruntime
          path: |
            out/FranyuLauncher-noruntime.apk
            out/FranyuLauncher-noruntime.apk.sha256
          compression-level: 0

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: hashFiles('out/app-gplay.aab') != ''
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Create GitHub Release v1.1
        uses: softprops/action-gh-release@v2
        if: github.repository_owner == 'fdef54983-del'
        with:
          tag_name: "v1.1"
          name: "FranyuLauncher v1.1"
          body: |
            ### FranyuLauncher APK
            Descarga los APK directamente desde **Assets** de este release.

            - **FranyuLauncher.apk** — Completo con Java Runtime
            - **FranyuLauncher-noruntime.apk** — Sin runtime

            ### Integridad
            Los APK se verifican durante CI con `unzip -t` y `apksigner verify` antes de publicarse.
            Los archivos `.sha256` permiten comprobar que la descarga no se corrompió.

            **Importante:** no uses el ZIP de GitHub Actions para instalar la aplicación. Descarga el APK directamente desde los Assets de este release.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher.apk
            out/FranyuLauncher-noruntime.apk
            out/FranyuLauncher.apk.sha256
            out/FranyuLauncher-noruntime.apk.sha256

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mojo
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
