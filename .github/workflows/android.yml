name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      FRANYU_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create out directory
        run: mkdir -p out
      - name: Build FranyuLauncher 1.4 Alpha APK
        run: |
          gradle :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FranyuLauncher-1.4-alpha.apk
      - name: Build FranyuLauncher 1.4 Alpha AAB
        run: |
          gradle :app_pojavlauncher:bundleFullRelease
          mv app_pojavlauncher/build/outputs/bundle/fullRelease/app_pojavlauncher-full-release.aab out/FranyuLauncher-1.4-alpha.aab
      - name: Build Debug APK (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-1.4-alpha-noruntime.apk
      - name: Verify APK and AAB archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher-1.4-alpha.apk
          test -s out/FranyuLauncher-1.4-alpha-noruntime.apk
          test -s out/FranyuLauncher-1.4-alpha.aab
          unzip -t out/FranyuLauncher-1.4-alpha.apk
          unzip -t out/FranyuLauncher-1.4-alpha-noruntime.apk
          unzip -t out/FranyuLauncher-1.4-alpha.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 out/FranyuLauncher-1.4-alpha.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.4-alpha.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.4-alpha-noruntime.apk
      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher-1.4-alpha.apk > out/FranyuLauncher-1.4-alpha.apk.sha256
          sha256sum out/FranyuLauncher-1.4-alpha-noruntime.apk > out/FranyuLauncher-1.4-alpha-noruntime.apk.sha256
          sha256sum out/FranyuLauncher-1.4-alpha.aab > out/FranyuLauncher-1.4-alpha.aab.sha256
      - name: Upload FranyuLauncher 1.3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-1.4-alpha
          path: |
            out/FranyuLauncher-1.4-alpha.apk
            out/FranyuLauncher-1.4-alpha.apk.sha256
            out/FranyuLauncher-1.4-alpha-noruntime.apk
            out/FranyuLauncher-1.4-alpha-noruntime.apk.sha256
            out/FranyuLauncher-1.4-alpha.aab
            out/FranyuLauncher-1.4-alpha.aab.sha256
          compression-level: 0
      - name: Create GitHub Release v1.4 Alpha
        uses: softprops/action-gh-release@v2
        if: github.repository_owner == 'fdef54983-del' && github.ref_name == 'feat/standard_cursors'
        with:
          tag_name: "v1.4-alpha"
          name: "FranyuLauncher v1.4 Alpha"
          body: |
            ### FranyuLauncher v1.4 Alpha
            - Rebrand cleanup and FranyuLauncher crash reporting.
            - Resilient downloads with concurrent workers, retries, exponential backoff and HTTP Range resume.
            - SHA-256 checksums for published artifacts.
            - Release APK and AAB builds with the stable FranyuLauncher debug signing key currently used by the project.
            - Deferred non-critical runtime initialization and session version-list caching.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher-1.4-alpha.apk
            out/FranyuLauncher-1.4-alpha.apk.sha256
            out/FranyuLauncher-1.4-alpha-noruntime.apk
            out/FranyuLauncher-1.4-alpha-noruntime.apk.sha256
            out/FranyuLauncher-1.4-alpha.aab
            out/FranyuLauncher-1.4-alpha.aab.sha256