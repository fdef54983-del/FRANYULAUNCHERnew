name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      FRANYU_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Executable Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          repo: artdeell/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create out directory
        run: mkdir -p out

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app_pojavlauncher/debug.keystore || true

      - name: Build FranyuLauncher 1.4 APK
        run: |
          ./gradlew :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FranyuLauncher-1.4.apk

      - name: Build FranyuLauncher 1.4 AAB
        run: |
          ./gradlew :app_pojavlauncher:bundleFullRelease
          mv app_pojavlauncher/build/outputs/bundle/fullRelease/app_pojavlauncher-full-release.aab out/FranyuLauncher-1.4.aab

      - name: Build Debug APK (No runtime)
        run: |
          ./gradlew :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FranyuLauncher-1.4-noruntime.apk

      - name: Verify APK and AAB archives before publishing
        run: |
          set -e
          test -s out/FranyuLauncher-1.4.apk
          test -s out/FranyuLauncher-1.4-noruntime.apk
          test -s out/FranyuLauncher-1.4.aab
          unzip -t out/FranyuLauncher-1.4.apk
          unzip -t out/FranyuLauncher-1.4-noruntime.apk
          unzip -t out/FranyuLauncher-1.4.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 out/FranyuLauncher-1.4.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.4.apk
          "$APKSIGNER" verify --verbose out/FranyuLauncher-1.4-noruntime.apk

      - name: Generate SHA-256 checksums
        run: |
          sha256sum out/FranyuLauncher-1.4.apk > out/FranyuLauncher-1.4.apk.sha256
          sha256sum out/FranyuLauncher-1.4-noruntime.apk > out/FranyuLauncher-1.4-noruntime.apk.sha256
          sha256sum out/FranyuLauncher-1.4.aab > out/FranyuLauncher-1.4.aab.sha256

      - name: Upload FranyuLauncher 1.4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FranyuLauncher-1.4
          path: |
            out/FranyuLauncher-1.4.apk
            out/FranyuLauncher-1.4.apk.sha256
            out/FranyuLauncher-1.4-noruntime.apk
            out/FranyuLauncher-1.4-noruntime.apk.sha256
            out/FranyuLauncher-1.4.aab
            out/FranyuLauncher-1.4.aab.sha256
          compression-level: 0

      - name: Create GitHub Release v1.4
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feat/standard_cursors' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v1.4"
          name: "FranyuLauncher v1.4"
          body: |
            ## 🚀 FranyuLauncher v1.4 Official Release

            ### ✨ Principales Novedades y Mejoras
            - **Nuevo Rediseño Visual Completo**: Interfaz moderno oscuro con estética carbón profundo AMOLED (`#0D1117`), acentos vibrantes verde esmeralda (`#10B981`), tarjetas limpias elevadas y retroalimentación táctil ripple refinada.
            - **Optimización de Rendimiento para Gama Baja**: Optimizaciones dedicadas para teléfonos como Samsung Galaxy A30 y chipsets Mali/Exynos.
            - **Eliminación de Tirones (Zero GC Stutters)**: Parámetros JVM de baja latencia con pausas de Garbage Collection reducidas a 20ms en lugar de los 150ms anteriores.
            - **SurfaceView por Hardware**: Aceleración por hardware directa en el compositor gráfico de Android para evitar la degradación de fotogramas.
            - **Escalado Inteligente de Resolución**: Ajuste dinámico de escala interna para mantener 45-60 FPS estables sin saturar el fillrate en pantallas 1080p con GPUs de pocos núcleos.
            - **Aceleración Gráfica GL4ES & Mesa**: Agrupamiento de llamadas de dibujo (`LIBGL_BATCH=1`), caché de shaders ampliada a 256MB y optimización de memoria de texturas (`LIBGL_SHRINK`, `LIBGL_STREAM`).
            - **Estabilidad y Corrección de Errores**: Corrección en la validación y firma de compilación en entornos CI, resolución de fugas de memoria y soporte ampliado de mods.

            ### 📦 Artefactos incluidos
            - `FranyuLauncher-1.4.apk`: Versión completa con entornos Java embebidos (JRE 8, JRE 17 y JRE 21).
            - `FranyuLauncher-1.4-noruntime.apk`: Versión compacta.
            - `FranyuLauncher-1.4.aab`: Android App Bundle para tiendas de aplicaciones.
            - Archivos de comprobación criptográfica `.sha256` para cada binario.
          draft: false
          prerelease: false
          files: |
            out/FranyuLauncher-1.4.apk
            out/FranyuLauncher-1.4.apk.sha256
            out/FranyuLauncher-1.4-noruntime.apk
            out/FranyuLauncher-1.4-noruntime.apk.sha256
            out/FranyuLauncher-1.4.aab
            out/FranyuLauncher-1.4.aab.sha256