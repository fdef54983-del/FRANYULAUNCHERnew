plugins {
    id 'com.android.application' version '8.11.1'
    id 'de.undercouch.download' version '5.6.0'
    id 'org.ajoberstar.grgit' version '5.3.2'
}
apply from: rootProject.file('gradle/prefab_bypass.gradle')
import de.undercouch.gradle.tasks.download.Download
static def getDate() { return new Date().format('yyyyMMdd') }
static def getDateSeconds() {
    // Keep CI APKs newer than older local builds while staying below Android's 2.1B limit.
    // YYYYMMDD * 100 + CI run number gives a monotonically increasing release code.
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        int run = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
        int dateCode = Integer.parseInt(new Date().format("yyyyMMdd"))
        return dateCode * 100 + (run % 100)
    }
    String ciCode = System.getenv("FRANYU_VERSION_CODE")
    if (ciCode != null && ciCode.isInteger()) return Integer.parseInt(ciCode)
    return 172005
}
def getVersionName = { def currentBranch = grgit.branch.current(); def latestCommit = grgit.log(maxCommits: 1); def dateToday = getDate(); if(currentBranch == null || latestCommit == null) return "LOCAL-${dateToday}"; return "1.3-${dateToday}-${latestCommit.abbreviatedId}-${currentBranch.getName()}" }
def getCFApiKey = { String key=System.getenv("CURSEFORGE_API_KEY"); if(key!=null)return key; File f=new File("./curseforge_key.txt"); if(f.canRead()&&f.isFile())return f.text; logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !'); return "DUMMY" }
configurations { instrumentedClasspath { canBeConsumed=false; canBeResolved=true } }
android {
 namespace 'git.artdeell.mojo'
 compileSdk=36
 lintOptions{abortOnError false}
 signingConfigs {
  customDebug {
   storeFile file("debug.keystore")
   storePassword "android"
   keyAlias "androiddebugkey"
   keyPassword "android"
  }
  googlePlayBuild {
   storeFile file("mojo_upload.jks")
   storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
   keyAlias "key0"
   keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
  }
 }
 defaultConfig{applicationId "com.franyu.launcher";minSdkVersion 21;targetSdkVersion 35;versionCode getDateSeconds();versionName getVersionName();multiDexEnabled true;resValue 'string','curseforge_api_key',getCFApiKey()}
 flavorDimensions=["runtime"]
 productFlavors{
  full{dimension "runtime"}
  noruntime{dimension "runtime";versionNameSuffix "-noruntime"}
 }
 buildTypes{
  debug{minifyEnabled false;shrinkResources false;proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro';signingConfig signingConfigs.customDebug;resValue 'string','application_package','com.franyu.launcher';resValue 'string','storageProviderAuthorities','com.franyu.launcher.scoped.gamefolder'}
  proguard{initWith debug;minifyEnabled true;shrinkResources true}
  proguardNoDebug{initWith proguard;debuggable false}
  release{minifyEnabled false;proguardFiles getDefaultProguardFile('proguard-android.txt'),'proguard-rules.pro';resValue 'string','storageProviderAuthorities','com.franyu.launcher.scoped.gamefolder';resValue 'string','application_package','com.franyu.launcher';signingConfig signingConfigs.customDebug}
  gplay{initWith release;signingConfig signingConfigs.customDebug}
 }
 ndkVersion="28.2.13676358"
 externalNativeBuild{ndkBuild{path file('src/main/jni/Android.mk')}}
 compileOptions{sourceCompatibility JavaVersion.VERSION_1_8;targetCompatibility JavaVersion.VERSION_1_8}
 bundle{language{enableSplit=false}}
 packagingOptions{jniLibs{useLegacyPackaging=true};pickFirst '**/libbytehook.so'}
 buildFeatures{prefab true;buildConfig true}
}
class AssetTaskRegistrar {
 private Project project; private Task mergeAssetsTask; private File targetAssetsDir; private String variantName; private File targetDownloadDir; private File projectJarDir;
 AssetTaskRegistrar(Project p){project=p;targetDownloadDir=new File(p.projectDir,"build/intermediates/download_deps");projectJarDir=new File(p.projectDir,"build/intermediates/package_jar_deps");createDirectories(targetDownloadDir);createDirectories(projectJarDir)}
 def setVariant(v){variantName=v.getName().capitalize();mergeAssetsTask=v.getPreBuildProvider().get();targetAssetsDir=new File(project.projectDir,"build/intermediates/remote_asset_set/${variantName.toLowerCase()}/");createDirectories(targetAssetsDir);project.android.sourceSets[v.getName()].assets.srcDirs+=targetAssetsDir.absolutePath}
 static def createDirectories(File l){if(!l.isDirectory()&&!l.mkdirs())throw new RuntimeException("Failed to create directory "+l.absolutePath)}
 static def writeVersion(File d){new File(d,"version").write(String.valueOf(new Date().time))}
 private def assetDestination(String p){new File(targetAssetsDir,p)}
 private def onlineUnzipTask(String u,String n,File t){createDirectories t;def d=new File(targetDownloadDir,n);def dt=project.tasks.register("download${n}${variantName}",Download){src u;dest d;overwrite false};return project.tasks.register("unzip${n}${variantName}",Copy){from project.zipTree(d);into t;dependsOn dt}}
 def onlineZipDependency(String u,String n,String p){mergeAssetsTask.dependsOn onlineUnzipTask(u,n,assetDestination(p))}
 def projectJarDependency(Project p,String r){def a=assetDestination(r);def j=new File(projectJarDir,r);createDirectories a;createDirectories j;def c=project.tasks.register("copyProjectJar${j.name}${variantName}",Copy){from j;into a;dependsOn ":${p.name}:jar"};mergeAssetsTask.dependsOn c;p.tasks.withType(org.gradle.jvm.tasks.Jar.class).configureEach{it.destinationDirectory=j;doLast{if(it.didWork)writeVersion j}}}
 def onlineJarDependency(String u,String p,String d,String v,String s,String r){def t=assetDestination(r);createDirectories t;def dt=project.tasks.register("download${p}${d}${variantName}",Download){src String.format(u,p,d,v,s);dest t;overwrite false;doLast{if(it.didWork)writeVersion t}};mergeAssetsTask.dependsOn dt}
 def jreRuntimeDependency(int v,String r){onlineZipDependency(String.format("https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre%d-pojav.zip",v),"ComponentRuntime${v}",r)}
}
afterEvaluate {
 def registrar=new AssetTaskRegistrar(project)
 android.applicationVariants.configureEach { v ->
  registrar.setVariant(v)
  registrar.projectJarDependency project(":forge_installer"),"components/forge_installer"
  registrar.projectJarDependency project(":jre_lwjgl3glfw"),"components/lwjgl3"
  if(v.name.toLowerCase().contains("full")){registrar.jreRuntimeDependency 8,"components/jre";registrar.jreRuntimeDependency 17,"components/jre-new";registrar.jreRuntimeDependency 21,"components/jre-21"}
  def u="https://jitpack.io/com/github/MojoLauncher/%1\$s/%2\$s/%3\$s/%2\$s-%3\$s%4\$s.jar"
  registrar.onlineJarDependency u,"caciocavallo","cacio-shared","-33120de13d-1","","components/caciocavallo"
  registrar.onlineJarDependency u,"caciocavallo","cacio-androidnw","-33120de13d-1","","components/caciocavallo"
  registrar.onlineJarDependency u,"caciocavallo17","cacio-tta","72a9ab6323","-jar-with-dependencies","components/caciocavallo17"
 }
}
dependencies{implementation 'javax.annotation:javax.annotation-api:1.3.2';implementation 'commons-codec:commons-codec:1.19.0';implementation 'androidx.preference:preference:1.2.1';implementation 'androidx.drawerlayout:drawerlayout:1.2.0';implementation 'androidx.viewpager2:viewpager2:1.1.0';implementation 'androidx.annotation:annotation:1.9.1';implementation "androidx.constraintlayout:constraintlayout:2.2.1";implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2';implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc';implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b';implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0';implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3';implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14';implementation 'org.tukaani:xz:1.10';implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29';implementation 'com.bytedance:bytehook:1.1.1';implementation 'com.github.MojoLauncher:alsoft-android-aar:f369161d5f';implementation 'com.google.zxing:core:3.5.4';implementation fileTree(dir:'libs',include:['*.jar','*.aar'])}